[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asiahelm9-inferopt_jd000"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对大模型推理优化工程师·尾延迟抖动与首 token 时间相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "asiahelm9" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://asiahelm9.github.io"
Repository = "https://github.com/asiahelm9/inferopt_jd000"
Issues = "https://github.com/asiahelm9/inferopt_jd000/issues"

[project.scripts]
inferopt_jd000 = "inferopt_jd000:main"

[tool.setuptools]
py-modules = ["inferopt_jd000"]
